name: Review head
on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review]
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number to recheck
        required: true
permissions:
  contents: read
  pull-requests: read
  issues: read
  statuses: write
concurrency:
  group: review-head-${{ github.event.pull_request.number || github.event.issue.number || inputs.pull_request }}
  cancel-in-progress: false
jobs:
  review:
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # This workflow never checks out or executes pull-request code. The
      # github-script dependency and inline policy come from the trusted base.
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          REVIEW_PUBLISHER: ${{ vars.REVIEW_PUBLISHER }}
        with:
          script: |
            const {owner, repo} = context.repo;
            // Manual dispatch must use the exact same canonical number as the
            // event concurrency group. No padded or alternate numeric spelling.
            const dispatchNumber = context.payload.inputs?.pull_request;
            if (dispatchNumber !== undefined && (typeof dispatchNumber !== 'string' ||
                !/^[1-9][0-9]*$/.test(dispatchNumber) ||
                !Number.isSafeInteger(Number(dispatchNumber)) || String(Number(dispatchNumber)) !== dispatchNumber)) {
              throw new Error('Dispatch pull request number must be canonical decimal');
            }
            const number = Number(context.payload.pull_request?.number || context.payload.issue?.number || context.payload.inputs?.pull_request);
            if (!Number.isSafeInteger(number) || number < 1) throw new Error('Invalid pull request number');
            const {data: pr} = await github.rest.pulls.get({owner, repo, pull_number: number});
            const status = (state, description) => github.rest.repos.createCommitStatus({owner, repo,
              sha: pr.head.sha, state, context: 'review-head', description,
              target_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`});
            // Invalidate an earlier success BEFORE any comment lookup or policy evaluation.
            // If this API write itself fails, GitHub cannot be made atomic by this script.
            await status('pending', 'Rechecking exact-head technical review');
            const publisher = process.env.REVIEW_PUBLISHER || '';
            const configured = /^[A-Za-z0-9][A-Za-z0-9-]{0,38}$/.test(publisher);
            const seatByPrefix = {'pomar-codex/': 'POMAR-Codex', 'pomar-cc/': 'POMAR-CC'};
            // A PR's head ref is its fixed declaration; editing the body cannot flip seats.
            const authorSeat = Object.entries(seatByPrefix).find(([prefix]) => pr.head.ref?.startsWith(prefix))?.[1];
            const reviewingSeat = authorSeat === 'POMAR-Codex' ? 'POMAR-CC' : 'POMAR-Codex';
            const keys = ['Reviewing-Seat', 'Reviewed-Head', 'Review-Verdict'];
            const fields = (text, key) => {
              const lines = []; let fence = null;
              // Declarations in HTML comments or tags (including collapsed details) do not count.
              const visible = (text || '').replace(/<!--[\s\S]*?(?:-->|$)/g, '').replace(/<([A-Za-z][\w-]*)\b[^>]*>[\s\S]*?<\/\1\s*>/g, '');
              for (const line of visible.split(/\r?\n/)) {
                const mark = line.match(/^ {0,3}(`{3,}|~{3,})/);
                if (mark) {
                  if (!fence) fence = mark[1];
                  else if (mark[1][0] === fence[0] && mark[1].length >= fence.length && line.trim() === mark[1]) fence = null;
                  continue;
                }
                if (!fence && line.startsWith(`${key}:`)) lines.push(line);
              }
              return lines;
            };
            const value = (text, key) => {
              const lines = fields(text, key);
              return lines.length === 1 ? lines[0].slice(key.length + 1).trim() : '';
            };
            const edited = c => !c.created_at || !c.updated_at || c.updated_at !== c.created_at;
            const list = () => github.paginate(github.rest.issues.listComments, {owner, repo, issue_number: number, per_page: 100});
            const fingerprint = comments => JSON.stringify(comments.filter(c => c.user?.login === publisher)
              .map(c => [c.id, c.created_at, c.updated_at, c.body]).sort((a, b) => a[0] - b[0]));
            const comments = await list();
            // Treat ANY edited publisher comment as a void declaration candidate. This
            // conservatively retains recognition even if an edit removes ALL review markers.
            // Creation order means only a NEW explicit review can resolve that candidate.
            const reviews = comments.filter(c => c.user?.login === publisher &&
              (edited(c) || keys.some(key => fields(c.body, key).length)));
            reviews.sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at) || b.id - a.id);
            const latest = reviews[0];
            let state = 'failure', description = 'Missing exact-head technical review';
            if (pr.state !== 'open') description = 'Pull request is not open';
            else if (!configured) description = 'Configure the trusted REVIEW_PUBLISHER repository variable';
            else if (!authorSeat || value(pr.body, 'Implementation-Seat') !== authorSeat) description = 'Implementation-Seat must match fixed pomar-codex/ or pomar-cc/ head ref';
            else if (latest) {
              const head = value(latest.body, 'Reviewed-Head');
              const verdict = value(latest.body, 'Review-Verdict');
              if (edited(latest)) description = 'Edited publisher comment is void; publish a fresh explicit review';
              else if (value(latest.body, 'Reviewing-Seat') !== reviewingSeat || !/^[a-f0-9]{40}$/.test(head)) description = 'Malformed latest technical review';
              else if (head !== pr.head.sha) description = 'Latest technical review names a different head';
              else if (verdict === 'no-blocker') { state = 'success'; description = 'Latest technical review matches this exact head'; }
              else description = verdict === 'blocked' ? 'Latest exact-head technical review is blocked' : 'Malformed latest review verdict';
            }
            // Deletion is NOT a withdrawal protocol. Publish a new blocked declaration;
            // deleting any comment cannot provide a reliable durable tombstone via this API.
            const again = await list();
            if (fingerprint(again) !== fingerprint(comments)) throw new Error('Review evidence changed while evaluating; remains pending');
            const {data: current} = await github.rest.pulls.get({owner, repo, pull_number: number});
            if (current.state !== pr.state || current.head.sha !== pr.head.sha || current.head.ref !== pr.head.ref || current.body !== pr.body) {
              throw new Error('Pull request changed while evaluating; remains pending');
            }
            // Check reviews AGAIN after the PR read, covering a blocker arriving in that read.
            if (fingerprint(await list()) !== fingerprint(comments)) throw new Error('Review evidence changed before publication; remains pending');
            await status(state, description);
            core.info(description);
            if (state !== 'success') core.setFailed(description);
